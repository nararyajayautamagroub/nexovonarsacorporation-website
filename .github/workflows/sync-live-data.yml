name: Refresh live repository and public metadata

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: live-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Sync public snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Refresh repository intelligence
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-github.mjs

      - name: Refresh public metadata
        run: node scripts/scrape-public.mjs

      - name: Validate generated snapshots
        run: npm test

      - name: Commit changed snapshots
        run: |
          if git diff --quiet -- github-live.js external-live.js; then
            echo "Live snapshots are unchanged; no commit is needed."
            exit 0
          fi

          git config user.name "NEXOVONARSA Live Data Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-live.js external-live.js
          git commit -m "chore: refresh live repository and public metadata"
          git push origin HEAD:main
