name: Sync Corporate GitHub Intelligence

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "sync-config.json"
      - "scripts/sync-github.mjs"
      - "scripts/scrape-public.mjs"
      - "scrape-config.json"

permissions:
  contents: write

concurrency:
  group: corporate-data-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate scripts
        run: |
          node --check scripts/sync-github.mjs
          node --check scripts/scrape-public.mjs

      - name: Sync repositories
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-github.mjs

      - name: Scrape public source metadata
        run: node scripts/scrape-public.mjs

      - name: Validate generated snapshots
        run: |
          node --check github-live.js
          node --check external-live.js
          node scripts/validate.mjs

      - name: Commit live snapshot safely
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "NEXOVONARSA Corporate Sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            echo "Snapshot publish attempt $attempt"
            git fetch origin main
            git reset --hard origin/main
            node scripts/sync-github.mjs
            node scripts/scrape-public.mjs
            node --check github-live.js
            node --check external-live.js
            node scripts/validate.mjs
            git add github-live.js external-live.js
            if git diff --cached --quiet; then
              echo "Snapshots are already current."
              exit 0
            fi
            git commit -m "chore: refresh GitHub corporate data"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main changed during push; regenerate snapshots from latest main."
            sleep 3
          done
          echo "Unable to publish snapshot after 4 regenerated attempts."
          exit 1
