name: Sync Corporate GitHub Intelligence

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync repositories
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-github.mjs

      - name: Commit live snapshot
        run: |
          git config user.name "NEXOVONARSA Corporate Sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-live.js
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh GitHub corporate data"
          git push
