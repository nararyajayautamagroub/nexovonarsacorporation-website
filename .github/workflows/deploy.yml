name: Publish NEXOVONARSA Corporation static site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static-site-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check data.js
          node --check portfolio.js
          node --check github-live.js

      - name: Stage static site
        run: |
          rm -rf /tmp/nexovonarsa-site
          mkdir -p /tmp/nexovonarsa-site
          cp index.html styles.css data.js portfolio.js app.js github-live.js /tmp/nexovonarsa-site/
          touch /tmp/nexovonarsa-site/.nojekyll

      - name: Publish gh-pages branch
        run: |
          git config user.name "NEXOVONARSA Static Publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan gh-pages
          git rm -rf . || true
          cp -R /tmp/nexovonarsa-site/. .
          git add .
          git commit -m "deploy: publish corporate control center"
          git push origin gh-pages --force
