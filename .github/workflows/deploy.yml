name: Publish NEXOVONARSA Corporation static site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: static-site-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check data.js
          node --check portfolio.js
          node --check github-live.js
          node --check external-live.js
          node scripts/validate.mjs
          node --check auth.js
          node --check experience.js
          node --check i18n.js
          node --check sw.js

      - name: Stage static site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          rm -rf /tmp/nexovonarsa-site
          mkdir -p /tmp/nexovonarsa-site
          cp index.html styles.css data.js portfolio.js app.js github-live.js external-live.js config.js config.example.js i18n.js auth.js experience.js sw.js pwa-manifest.webmanifest /tmp/nexovonarsa-site/
          cp -R icons /tmp/nexovonarsa-site/
          node - <<'NODE'
          const fs = require("node:fs");
          const url = process.env.SUPABASE_URL || "";
          const key = process.env.SUPABASE_PUBLISHABLE_KEY || "";
          if (url && key) {
            const code = [
              "window.NX_CONFIG={",
              "supabase:" + JSON.stringify({url:url,publishableKey:key}) + ",",
              "auth:{redirectTo:window.location.origin+window.location.pathname},",
              "app:" + JSON.stringify({
                version:"5.3.0",
                defaultLanguage:"id",
                supportedLanguages:["id","en","ms","vi","th","zh","ja","ko","ar","es"],
                autoRefreshMinutes:15
              }),
              "};\\n"
            ].join("");
            fs.writeFileSync("/tmp/nexovonarsa-site/config.js", code, "utf8");
            console.log("Runtime Supabase configuration prepared for the published site.");
          } else {
            console.log("Supabase deployment secrets are not configured; published site keeps the safe placeholder config.js.");
          }
          NODE
          node --check /tmp/nexovonarsa-site/config.js
          touch /tmp/nexovonarsa-site/.nojekyll

      - name: Publish gh-pages branch
        run: |
          git config user.name "NEXOVONARSA Static Publisher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan gh-pages
          git rm -rf . || true
          cp -R /tmp/nexovonarsa-site/. .
          git add .
          git commit -m "deploy: publish corporate control center"
          git push origin gh-pages --force
