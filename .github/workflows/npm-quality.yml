name: NPM Frontend Gateway Quality

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: npm install
        run: npm install --no-audit --no-fund
      - name: npm ci
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: npm test
        run: npm test
